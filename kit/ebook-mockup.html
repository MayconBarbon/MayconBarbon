<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.stage{width:1200px;height:900px;position:relative;perspective:2600px;perspective-origin:50% 40%}
.pg{position:absolute;width:440px;height:622px;background-size:cover;border-radius:3px;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.p3{left:640px;top:170px;background-image:url(hi-03.jpg);transform:rotateY(-24deg) rotateZ(4deg);filter:brightness(.97)}
.p2{left:520px;top:130px;background-image:url(hi-02.jpg);transform:rotateY(-24deg) rotateZ(1.5deg)}
.book{position:absolute;left:150px;top:90px;width:470px;height:665px;transform-style:preserve-3d;transform:rotateY(28deg) rotateX(4deg) rotateZ(-2deg)}
.front{position:absolute;inset:0;background:url(hi-01.jpg) center/cover;border-radius:2px 5px 5px 2px;transform:translateZ(14px);box-shadow:inset 6px 0 10px rgba(0,0,0,.35),inset -1px 0 0 rgba(255,255,255,.2)}
.front:after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 35%,rgba(0,0,0,.08) 100%)}
.spine{position:absolute;left:0;top:0;width:28px;height:100%;background:#0d1a2e;transform:rotateY(-90deg) translateZ(0px);transform-origin:left center;filter:brightness(.7)}
.pages{position:absolute;right:0;top:4px;width:28px;height:calc(100% - 8px);transform:rotateY(90deg);transform-origin:right center;background:repeating-linear-gradient(90deg,#f4f1ea 0 2px,#d9d4ca 2px 3px)}
.top{position:absolute;left:0;top:0;width:100%;height:28px;transform:rotateX(90deg);transform-origin:top center;background:repeating-linear-gradient(0deg,#f4f1ea 0 2px,#d9d4ca 2px 3px)}
.back{position:absolute;inset:0;background:#0d1a2e;transform:translateZ(-14px)}
.shadow{position:absolute;left:150px;top:760px;width:820px;height:60px;background:radial-gradient(ellipse at center,rgba(0,0,0,.45),rgba(0,0,0,0) 70%);filter:blur(6px)}
</style></head><body><div class="stage">
<div class="shadow"></div>
<div class="pg p3"></div><div class="pg p2"></div>
<div class="book"><div class="back"></div><div class="spine"></div><div class="pages"></div><div class="front"></div></div>
</div></body></html>
